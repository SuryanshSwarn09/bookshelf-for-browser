name: Build, Test & Package Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Extension Assets
        run: npm run build

      - name: Package Extension ZIP Artifact
        run: |
          cd dist
          zip -r ../bookshelf-extension.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookshelf-extension
          path: bookshelf-extension.zip

      - name: Create Release & Attach Extension ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bookshelf-extension.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
